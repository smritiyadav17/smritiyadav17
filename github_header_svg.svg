<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f4fd;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Pattern overlay -->
  <rect width="1200" height="400" fill="url(#dots)"/>
  
  <!-- Floating shapes -->
  <circle cx="100" cy="80" r="40" fill="rgba(255,255,255,0.1)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,10; 0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="1100" cy="320" r="60" fill="rgba(255,255,255,0.08)" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0; -15,15; 0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <polygon points="200,300 220,320 180,320" fill="rgba(255,255,255,0.1)" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 200 307; 360 200 307" dur="20s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Tech icons as decorative elements -->
  <g transform="translate(950, 50)" opacity="0.3">
    <!-- Python icon -->
    <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="15" y="20" text-anchor="middle" fill="white" font-size="12" font-family="Arial">Py</text>
  </g>
  
  <g transform="translate(1000, 50)" opacity="0.3">
    <!-- React icon -->
    <circle cx="15" cy="15" r="15" fill="rgba(255,255,255,0.2)"/>
    <text x="15" y="20" text-anchor="middle" fill="white" font-size="10" font-family="Arial">⚛</text>
  </g>
  
  <g transform="translate(1050, 50)" opacity="0.3">
    <!-- AWS icon -->
    <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="15" y="20" text-anchor="middle" fill="white" font-size="8" font-family="Arial">AWS</text>
  </g>
  
  <g transform="translate(1100, 50)" opacity="0.3">
    <!-- Code icon -->
    <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="15" y="20" text-anchor="middle" fill="white" font-size="12" font-family="Arial">&lt;/&gt;</text>
  </g>
  
  <!-- Main content -->
  <g transform="translate(80, 120)">
    <!-- Greeting -->
    <text x="0" y="0" fill="url(#textGlow)" font-size="32" font-family="Arial, sans-serif" font-weight="300" opacity="0.9">
      Hi there! 👋 I'm
    </text>
    
    <!-- Name -->
    <text x="0" y="60" fill="white" font-size="56" font-family="Arial, sans-serif" font-weight="bold" filter="url(#glow)">
      Smriti Yadav
    </text>
    
    <!-- Title -->
    <text x="0" y="110" fill="#e8f4fd" font-size="24" font-family="Arial, sans-serif" font-weight="300">
      Software Engineer | Backend Developer | Cloud Enthusiast
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="145" fill="rgba(255,255,255,0.8)" font-size="18" font-family="Arial, sans-serif" font-weight="300">
      Passionate about building scalable solutions with Python, AWS &amp; serverless architecture
    </text>
  </g>
  
  <!-- Skill tags -->
  <g transform="translate(80, 300)">
    <rect x="0" y="0" width="80" height="35" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="40" y="23" text-anchor="middle" fill="white" font-size="14" font-family="Arial" font-weight="500">Python</text>
    
    <rect x="95" y="0" width="60" height="35" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="125" y="23" text-anchor="middle" fill="white" font-size="14" font-family="Arial" font-weight="500">AWS</text>
    
    <rect x="170" y="0" width="90" height="35" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="215" y="23" text-anchor="middle" fill="white" font-size="14" font-family="Arial" font-weight="500">FastAPI</text>
    
    <rect x="275" y="0" width="80" height="35" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="315" y="23" text-anchor="middle" fill="white" font-size="14" font-family="Arial" font-weight="500">Docker</text>
    
    <rect x="370" y="0" width="100" height="35" rx="18" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="420" y="23" text-anchor="middle" fill="white" font-size="14" font-family="Arial" font-weight="500">DynamoDB</text>
  </g>
  
  <!-- Female developer illustration -->
  <g transform="translate(800, 120)">
    <!-- Laptop -->
    <rect x="0" y="100" width="200" height="120" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <rect x="10" y="110" width="180" height="100" rx="4" fill="rgba(0,0,0,0.3)"/>
    
    <!-- Screen content (code) -->
    <rect x="20" y="120" width="10" height="2" fill="#4CAF50" opacity="0.8"/>
    <rect x="35" y="120" width="30" height="2" fill="#2196F3" opacity="0.8"/>
    <rect x="70" y="120" width="20" height="2" fill="#FF9800" opacity="0.8"/>
    
    <rect x="20" y="130" width="25" height="2" fill="#E91E63" opacity="0.8"/>
    <rect x="50" y="130" width="40" height="2" fill="#9C27B0" opacity="0.8"/>
    
    <rect x="30" y="140" width="35" height="2" fill="#00BCD4" opacity="0.8"/>
    <rect x="70" y="140" width="15" height="2" fill="#FFC107" opacity="0.8"/>
    
    <rect x="20" y="150" width="20" height="2" fill="#4CAF50" opacity="0.8"/>
    <rect x="45" y="150" width="45" height="2" fill="#F44336" opacity="0.8"/>
    
    <!-- Coffee cup -->
    <ellipse cx="240" cy="200" rx="12" ry="15" fill="rgba(255,255,255,0.2)"/>
    <rect x="228" y="185" width="24" height="20" rx="12" fill="rgba(255,255,255,0.2)"/>
    <path d="M 252 195 Q 265 195 265 205 Q 265 215 252 215" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>
    
    <!-- Steam from coffee -->
    <path d="M 235 180 Q 237 175 235 170" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 240 180 Q 242 175 240 170" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 245 180 Q 247 175 245 170" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Location and contact info -->
  <g transform="translate(950, 350)" opacity="0.7">
    <text x="0" y="0" fill="white" font-size="16" font-family="Arial">📍 Mumbai, India</text>
    <text x="0" y="25" fill="white" font-size="16" font-family="Arial">💼 Open to opportunities</text>
  </g>
</svg>